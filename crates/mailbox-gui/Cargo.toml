[package]
name = "mailbox-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native egui frontend for Mailbox"
default-run = "mailbox"

[[bin]]
name = "mailbox"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
mailbox-ailiak.workspace = true
mailbox-core.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Mailbox"
identifier = "com.ailiak.Mailbox"
before-packaging-command = "cargo build -p mailbox-gui --release"
