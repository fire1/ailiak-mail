[package]
name = "mailbox-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native egui frontend for AiliakMail"
default-run = "ailiakmail"

[[bin]]
name = "ailiakmail"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dotenvy = "0.15"
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
egui-phosphor = "0.7.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mailbox-ailiak.workspace = true
mailbox-core.workspace = true
md-5 = "0.10"
reqwest = { workspace = true, features = ["blocking"] }
resvg = "0.45"
rfd = "0.15"
rodio = { version = "0.20", default-features = false }
sha2 = "0.10"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
wry = "0.53"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Match eframe’s winit — used to force X11 so wry child webviews work on Wayland.
winit = "0.30"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "AiliakMail"
identifier = "com.ailiak.AiliakMail"
before-packaging-command = "cargo build -p mailbox-gui --release"
