[package]
name = "mailbox-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MCP stdio server for local AiliakMail mail (accounts, folders, messages)"
default-run = "ailiakmail-mcp"

[[bin]]
name = "ailiakmail-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
mailbox-core.workspace = true
rmcp = { version = "3.11", default-features = true, features = ["server", "transport-io"] }
schemars = { version = "1", features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
