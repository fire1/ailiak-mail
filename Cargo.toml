[workspace]
resolver = "2"
members = [
    "crates/mailbox-core",
    "crates/mailbox-ailiak",
    "crates/mailbox-gui",
]
default-members = ["crates/mailbox-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mailbox contributors"]
repository = "https://github.com/example/mailbox"

[workspace.dependencies]
mailbox-core = { path = "crates/mailbox-core" }
mailbox-ailiak = { path = "crates/mailbox-ailiak" }
anyhow = "1"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
futures = "0.3"
keyring = "3"
mail-parser = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
