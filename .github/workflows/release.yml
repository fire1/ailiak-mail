name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
          - os: macos-latest
            formats: app,dmg
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo packager --release --formats ${{ matrix.formats }}

      # Apple Silicon runner: native arm64 + cross-compile Intel (x86_64).
      # Set CARGO_BUILD_TARGET so before-packaging-command builds the same triple.
      - name: Package macOS arm64 + Intel
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            case "$triple" in
              aarch64-apple-darwin) arch=aarch64 ;;
              x86_64-apple-darwin) arch=x86_64 ;;
            esac
            echo "::group::packager $triple"
            CARGO_BUILD_TARGET="$triple" \
              cargo packager --release --formats app,dmg --target "$triple"
            echo "::endgroup::"

            # Outputs land under target/<triple>/release/ when --target is set.
            bundle="target/${triple}/release"
            ls -la "$bundle" || true
            for dmg in "$bundle"/AiliakMail_*.dmg "$bundle"/*.dmg; do
              [[ -f "$dmg" ]] || continue
              cp -f "$dmg" "dist/$(basename "$dmg")"
            done
            if [[ -d "$bundle/AiliakMail.app" ]]; then
              tar -C "$bundle" -czf "dist/AiliakMail-${arch}.app.tar.gz" AiliakMail.app
            fi
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ailiakmail-${{ matrix.os }}
          path: |
            dist/*
            target/release/*.dmg
            target/release/*.app.tar.gz
            target/release/*.deb
            target/release/*.AppImage
            target/release/*.exe
            target/release/*.msi
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            target/release/*.dmg
            target/release/*.app.tar.gz
            target/release/*.deb
            target/release/*.AppImage
            target/release/*.exe
            target/release/*.msi
          fail_on_unmatched_files: false
